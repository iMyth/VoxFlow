[package]
name = "voxflow-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "voxflow-cli"
path = "main.rs"

[dependencies]
vox_flow_lib = { package = "voxflow", path = ".." }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
